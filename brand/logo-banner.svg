<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Void Black Canvas -->
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Subtle Ambient Iris Violet Radial Atmosphere -->
  <radialGradient id="topGlow" cx="50%" cy="10%" r="60%">
    <stop offset="0%" stop-color="#9281f7" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#9281f7" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#topGlow)"/>

  <!-- Hairline Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" stroke="#292d30" stroke-width="2"/>

  <!-- Left: The Logo Mark Icon (240x240) in Rounded Container -->
  <g transform="translate(120, 195)">
    <rect width="240" height="240" rx="48" fill="#0b0e14"/>
    <rect x="1" y="1" width="238" height="238" rx="47" stroke="#292d30" stroke-width="2"/>
    <g transform="translate(20, 20) scale(0.39)">
      <!-- Client Agent Bracket -->
      <path d="M120 190L190 120H240L165 195V285L120 330V190Z" stroke="#f0f0f0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="#000000" fill-opacity="0.6"/>
      <!-- Worker Agent Bracket -->
      <path d="M392 322L322 392H272L347 317V227L392 182V322Z" stroke="#f0f0f0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="#000000" fill-opacity="0.6"/>
      <!-- Central AI Magistrate Consensus Core -->
      <path d="M256 145L340 256L256 367L172 256Z" fill="#9281f7" fill-opacity="0.35" stroke="#9281f7" stroke-width="18" stroke-linejoin="round"/>
      <path d="M256 195L300 256L256 317L212 256Z" stroke="#baa7ff" stroke-width="8" fill="#baa7ff" fill-opacity="0.15" stroke-linejoin="round"/>
      <circle cx="256" cy="256" r="22" fill="#ffffff"/>
      <circle cx="256" cy="256" r="10" fill="#9281f7"/>
    </g>
  </g>

  <!-- Right: Typography & Brand Narrative -->
  <g transform="translate(420, 210)">
    <!-- Pill Badge -->
    <rect width="320" height="32" rx="16" fill="#0b0e14" stroke="#292d30" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="4" fill="#3ad389"/>
    <text x="34" y="21" font-family="'Courier New', monospace" font-size="12" fill="#f0f0f0" font-weight="600" letter-spacing="1">GENLAYER INTELLIGENT PROTOCOL</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="68" fill="#ffffff" font-weight="700" letter-spacing="-1.5">AgentSettle</text>

    <!-- Subtitle -->
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#a1a4a5" font-weight="400">Autonomous SLA &amp; Dispute Arbitration for AI Agents</text>

    <!-- Secondary details -->
    <text x="0" y="195" font-family="'Courier New', monospace" font-size="14" fill="#6e727a">Double-Sided Collateral  |  Equivalence Principle  |  Studionet 61999</text>
  </g>
</svg>
